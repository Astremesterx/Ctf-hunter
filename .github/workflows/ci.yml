name: Security and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-scraping.txt
      - run: python -m pip install -r requirements-scraping.txt pip-audit==2.10.1
      - run: python -m pip_audit -r requirements-scraping.txt
      - run: python -m unittest discover -s tests -p scrapling_test.py -v
      - run: npm run audit:prod
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
