name: Check approved event sources
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: signalctf-ingestion
  cancel-in-progress: false
jobs:
  check:
    if: vars.INGESTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/run-ingestion.mjs
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
